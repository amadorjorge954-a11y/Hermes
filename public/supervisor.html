<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes — Panel del supervisor</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--pri:#043D80;--pri2:#1C5DAE;--acc:#FCA728;--mag:#E60182;--lime:#81FE02;--bg:#F2F5FA;--card:#fff;--txt:#14233A;--mut:#66748A;--ok:#3E8E06;--okbg:#ECFBD9;--warn:#B8650A;--warnbg:#FFF2DE;--bad:#C0392B;--badbg:#FBE7E5;--line:#E2E8F0;--infobg:#E5EEF9}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button,input,select{font-family:inherit;font-size:inherit}
.stripe{height:5px;background:linear-gradient(90deg,var(--mag) 0 25%,var(--acc) 25% 50%,var(--lime) 50% 75%,var(--pri2) 75% 100%)}
.shell{display:flex;height:100vh}
.side{width:236px;background:var(--pri);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand .face{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.brand .face img{width:34px}
.brand .t{font-weight:900;font-size:18px;line-height:1}
.brand .s{font-size:12px;opacity:.8}
.side nav{flex:1;padding:8px 10px;overflow-y:auto}
.side nav a{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;padding:10px 12px;border-radius:10px;font-weight:700;opacity:.85;margin-bottom:2px}
.side nav a:hover{background:rgba(255,255,255,.08);opacity:1}
.side nav a.on{background:#fff;color:var(--pri);opacity:1}
.side nav a .badge{margin-left:auto;background:var(--mag);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px}
.side nav a svg{width:18px;height:18px;flex-shrink:0}
.side .foot{padding:14px 18px;font-size:12px;border-top:1px solid rgba(255,255,255,.15)}
.side .foot b{display:block;font-size:13px}
.side .foot button{margin-top:8px;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px}
.topbar h1{margin:0;font-size:21px;font-weight:900;color:var(--pri)}
.topbar .sub{color:var(--mut);font-size:13px}
.topbar .sp{flex:1}
.topbar select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:700}
.demo{background:var(--warnbg);color:var(--warn);font-size:12px;font-weight:800;padding:5px 10px;border-radius:20px}
.content{flex:1;overflow-y:auto;padding:22px 26px 40px}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}
.k5{grid-template-columns:repeat(5,1fr)}
.c2{grid-template-columns:3fr 2fr}
.c11{grid-template-columns:1fr 1fr}
@media(max-width:1200px){.k5{grid-template-columns:repeat(3,1fr)}.c2,.c11,.c32{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:800}
.card .h3s{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.kpi .v{font-size:26px;font-weight:900;margin-top:4px;letter-spacing:-.3px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:3px}
.bar{height:7px;background:#E6EBF1;border-radius:6px;overflow:hidden;margin-top:9px}
.bar>div{height:100%;background:var(--pri2);border-radius:6px}
.bar.ok>div{background:var(--ok)}.bar.warn>div{background:var(--acc)}.bar.bad>div{background:var(--bad)}
.mt{margin-top:14px}
.grid>*{min-width:0}
.c32{grid-template-columns:3fr 2fr}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:800;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:#fff}
table.t td{padding:9px 8px;border-bottom:1px solid #EEF2F6;white-space:nowrap}
table.t td.r,table.t th.r{text-align:right}
table.t tr.tap{cursor:pointer}
table.t tr.tap:hover td{background:#F6F9FD}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:20px;background:#EEF1F5;color:var(--mut)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--infobg);color:var(--pri)}.chip.mag{background:#FDE3F1;color:#B3006A}
.alert{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid #EEF2F6}
.alert:first-of-type{border-top:0}
.alert .ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.alert .ic.bad{background:var(--badbg);color:var(--bad)}.alert .ic.warn{background:var(--warnbg);color:var(--warn)}.alert .ic.info{background:var(--infobg);color:var(--pri)}
.alert .tt{font-weight:800}.alert .dd{color:var(--mut);font-size:12.5px;margin-top:2px}
.filters{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.filters input,.filters select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
.filters input{width:260px}
.scroll{max-height:560px;overflow:auto}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--pri);font-weight:800;text-decoration:none;margin-bottom:12px}
.drawer{position:fixed;inset:0;background:rgba(10,20,40,.4);display:flex;justify-content:flex-end;z-index:20}
.drawer .pane{width:460px;max-width:100%;background:#fff;height:100%;overflow-y:auto;padding:22px}
.drawer .x{float:right;border:0;background:#EEF1F5;border-radius:8px;padding:6px 10px;font-weight:800;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px;margin:12px 0}
.kv div:nth-child(odd){color:var(--mut)}.kv div:nth-child(even){font-weight:700;text-align:right}
.total{display:flex;justify-content:space-between;font-weight:900;font-size:18px;padding-top:10px}
.form label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin:12px 0 5px}
.form input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}
.big{font-size:30px;font-weight:900;color:var(--pri)}
.note{background:var(--infobg);color:var(--pri);border-radius:10px;padding:10px 12px;font-size:12.5px}
.chartbox{position:relative;height:280px}
.login{min-height:100vh;display:flex;flex-direction:column}
.login .box{margin:auto;width:380px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center}
.login img{width:120px}
.login h2{margin:8px 0 2px;color:var(--pri);font-weight:900}
.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:10px;font-size:15px}
.login button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.err{color:var(--bad);font-weight:700;font-size:13px;min-height:18px;margin-top:8px}
.muted{color:var(--mut)}
.seq{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-weight:900;font-size:11.5px;background:var(--infobg);color:var(--pri)}
.seq.ok{background:var(--okbg);color:var(--ok)}.seq.warn{background:var(--warnbg);color:var(--warn)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ================= CONFIG Y CATÁLOGOS =================
const CFG={costoVisita:60,margen:0.15,metaVenta:20000,comision:0.04,cedis:'CEDIS León'};
const minPedido=()=>Math.ceil(CFG.costoVisita/CFG.margen);
const PRODUCTS=[
 {id:1,n:'Refresco Cola 600 ml',c:'Bebidas',p:{Centro:14,'Pacífico':15},e:1},{id:2,n:'Refresco Naranja 600 ml',c:'Bebidas',p:{Centro:13,'Pacífico':14}},
 {id:3,n:'Agua natural 1 L',c:'Bebidas',p:{Centro:10,'Pacífico':11},e:1},{id:4,n:'Papas clásicas 45 g',c:'Botanas',p:{Centro:16,'Pacífico':17},e:1},
 {id:5,n:'Papas chile y limón 45 g',c:'Botanas',p:{Centro:16,'Pacífico':17}},{id:6,n:'Cacahuates japoneses 60 g',c:'Botanas',p:{Centro:12,'Pacífico':13}},
 {id:7,n:'Galletas María 170 g',c:'Galletas',p:{Centro:18,'Pacífico':19},e:1},{id:8,n:'Galletas chocolate 90 g',c:'Galletas',p:{Centro:15,'Pacífico':16}},
 {id:9,n:'Gelatina fresa 120 g',c:'Postres',p:{Centro:11,'Pacífico':12}},{id:10,n:'Gelatina uva 120 g',c:'Postres',p:{Centro:11,'Pacífico':12}},
 {id:11,n:'Gelatina limón 120 g',c:'Postres',p:{Centro:11,'Pacífico':12}},{id:12,n:'Pan blanco grande',c:'Panificados',p:{Centro:42,'Pacífico':44},e:1},
 {id:13,n:'Pastelito chocolate',c:'Panificados',p:{Centro:14,'Pacífico':15}},{id:14,n:'Leche entera 1 L',c:'Lácteos',p:{Centro:26,'Pacífico':27},e:1},
 {id:15,n:'Yogurt fresa 250 g',c:'Lácteos',p:{Centro:15,'Pacífico':16}},{id:16,n:'Detergente en polvo 500 g',c:'Limpieza',p:{Centro:28,'Pacífico':29}}];
const ZONA=[1,4,12,14,7,3,9,5,13,8,2,6,15,16,11,10];
const P=id=>PRODUCTS.find(x=>x.id===+id);
const price=id=>P(id).p.Centro;

// ================= DATOS SIMULADOS (semilla fija) =================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20261117);const ri=(a,b)=>Math.floor(rnd()*(b-a+1))+a;const pick=a=>a[Math.floor(rnd()*a.length)];
const VEND=['Juan Pérez','Carlos Méndez','Miguel Ortiz','Roberto Sánchez','Daniel Herrera','Alejandro Cruz','Fernando Ríos','Óscar Delgado'];
const REP=['Luis Gómez','Arturo Vega','Jorge Luna','Raúl Castillo','Héctor Navarro','Iván Morales','Pedro Aguilar','Sergio Ramos'];
const ZN=['Centro','San Juan de Dios','Obregón','Las Joyas','Jardines de Jerez','San Miguel','El Coecillo','Los Paraísos'];
const TIPOS=['Abarrotes','Tienda','Miscelánea','Súper','Tiendita','Depósito'];
const NOMS=['Doña Lupe','El Güero','La Esperanza','San José','Mary','Don Chuy','La Güera','Los Pinos','El Sol','La Bendición','Don Beto','La Esquina','Rosy','El Ahorro','Santa Cruz','La Pasadita','Don Toño','La Palma','Lupita','El Triunfo','La Fe','Los Compadres','Doña Mago','El Paisa','La Morena','San Judas','Don Pancho','La Única','El Faro','Las Palmas','Doña Chela','El Rincón'];
const MOT_SV=['Tiene inventario suficiente','Sin efectivo','Encargado ausente','Tienda cerrada'];
const MOT_C=['Caducado','Próximo a caducar','Dañado'];
const PROG=[0.95,0.88,0.72,0.91,0.62,0.83,0.97,0.79],SVR=[0.08,0.1,0.12,0.07,0.26,0.1,0.06,0.11],RPROG=[1,1,0.8,1,0.7,0.92,1,0.86];
const ROUTES=[],CLIENTS=[],ORDERS=[],DELIV=[];let oseq=1;
function mkItems(c,f){const it={};for(const k in c.rec){const q=Math.max(1,Math.round(c.rec[k]*f*(0.8+rnd()*0.4)));it[k]=q}
  if(rnd()<0.3){const s=ZONA.slice(0,8).find(id=>!it[id]);if(s)it[s]=6}
  let t=tot(it);while(t<minPedido()){const k=Object.keys(it)[0];it[k]+=6;t=tot(it)}return it}
function tot(it){return Object.entries(it).reduce((a,[k,q])=>a+price(k)*q,0)}
for(let r=0;r<8;r++){
  const id=101+r,n=ri(26,32);const route={id,vend:VEND[r],rep:REP[r],zona:ZN[r],meta:CFG.metaVenta,clientes:[],hist:[],liq:null};
  const used=new Set();
  for(let i=0;i<n;i++){
    let nm;do{nm=pick(TIPOS)+' '+pick(NOMS)}while(used.has(nm));used.add(nm);
    const rec={};const k=ri(3,6);const pool=ZONA.slice(0,12);while(Object.keys(rec).length<k){rec[pick(pool)]=pick([6,6,12,12,12,24])}
    const merma={};if(rnd()<0.22){const s=+pick(Object.keys(rec));merma[s]=ri(2,3)}
    const c={id:`C${id}-${String(i+1).padStart(2,'0')}`,n:nm,ruta:id,seq:i+1,avg:0,rec,merma,ult:rnd()<0.06?ri(14,24):7,tel:`477 ${ri(100,999)} ${ri(1000,9999)}`,
      dir:`Calle ${pick(['Hidalgo','Morelos','Juárez','Allende','Aldama','Madero','Zaragoza','Guerrero'])} ${ri(10,999)}, Col. ${ZN[r]}`};
    c.avg=Math.round(tot(rec)/10)*10;
    // visita de hoy
    const h0=8*60+i*14+ri(0,8);
    if(i<Math.round(n*PROG[r])){
      if(rnd()<SVR[r]){c.hoy={st:'sin_venta',mot:pick(MOT_SV),hora:h0}}
      else{const it=mkItems(c,1);const cam=rnd()<0.25?[{sku:+(Object.keys(c.merma)[0]||pick(Object.keys(rec))),q:ri(1,3),m:pick(MOT_C)}]:[];
        const o={id:'P-'+String(oseq++).padStart(5,'0'),cid:c.id,ruta:id,vend:VEND[r],items:it,cambios:cam,total:tot(it),fecha:'Hoy',hora:h0,status:'Por entregar'};
        ORDERS.push(o);c.hoy={st:'pedido',oid:o.id,hora:h0}}
    }else c.hoy={st:'pendiente'};
    CLIENTS.push(c);route.clientes.push(c);
  }
  // reparto de hoy (pedidos levantados ayer)
  const rcl=route.clientes.filter(()=>rnd()<0.85);const nd=Math.round(rcl.length*RPROG[r]);
  rcl.forEach((c,j)=>{const it=mkItems(c,1);const cam=rnd()<0.25?[{sku:+pick(Object.keys(c.rec)),q:ri(1,3),m:pick(MOT_C)}]:[];
    const o={id:'P-'+String(oseq++).padStart(5,'0'),cid:c.id,ruta:id,vend:VEND[r],items:it,cambios:cam,total:tot(it),fecha:'Ayer',hora:8*60+j*15,status:'Por entregar'};
    if(j<nd){const ent={...it};if(rnd()<0.07){const k=Object.keys(ent)[0];ent[k]=Math.max(0,ent[k]-ri(1,3))}
      const cob=tot(ent);o.status='Entregado';o.entregado=ent;o.cobro={met:rnd()<0.7?'Efectivo':'Transferencia',monto:cob,hora:9*60+j*13};o.cambios.forEach(x=>x.hecho=rnd()<0.92)}
    ORDERS.push(o);DELIV.push(o)});
  const myD=DELIV.filter(o=>o.ruta===id),done=myD.filter(o=>o.status==='Entregado');
  const efe=done.filter(o=>o.cobro.met==='Efectivo').reduce((a,o)=>a+o.cobro.monto,0);
  const closed=RPROG[r]===1&&r!==3;const dif=id===103?-150:(id===106?-42:0);
  route.liq={estado:closed?'Cerrada':(RPROG[r]===1?'Por cerrar':'En ruta'),efectivo:efe,transf:done.reduce((a,o)=>a+o.cobro.monto,0)-efe,depositado:closed?efe+dif:null,dif:closed?dif:null,
    esperado:myD.reduce((a,o)=>a+o.total,0),entregas:done.length,total:myD.length};
  for(let d=7;d>=1;d--)route.hist.push({d,venta:Math.round(CFG.metaVenta*(0.76+rnd()*0.32)),cob:0.84+rnd()*0.15});
  ROUTES.push(route);
}
// ================= MÉTRICAS =================
const CL=id=>CLIENTS.find(c=>c.id===id);const RT=id=>ROUTES.find(r=>r.id===+id);
function rStats(r){const cl=r.clientes;const vis=cl.filter(c=>c.hoy.st!=='pendiente');const os=ORDERS.filter(o=>o.ruta===r.id&&o.fecha==='Hoy');
  const venta=os.reduce((a,o)=>a+o.total,0);const sv=cl.filter(c=>c.hoy.st==='sin_venta');const del=DELIV.filter(o=>o.ruta===r.id);const ent=del.filter(o=>o.status==='Entregado');
  return {prog:cl.length,vis:vis.length,cob:vis.length/cl.length,ped:os.length,venta,pct:venta/r.meta,sv:sv.length,svPerd:sv.reduce((a,c)=>a+c.avg,0),pendEst:cl.filter(c=>c.hoy.st==='pendiente').reduce((a,c)=>a+c.avg,0),
    ticket:os.length?venta/os.length:0,ent:ent.length,entTot:del.length,cobrado:ent.reduce((a,o)=>a+o.cobro.monto,0),porCobrar:del.filter(o=>o.status!=='Entregado').reduce((a,o)=>a+o.total,0),
    camb:os.reduce((a,o)=>a+o.cambios.reduce((b,x)=>b+x.q,0),0),esen:os.reduce((a,o)=>a+PRODUCTS.filter(p=>p.e&&o.items[p.id]).length/PRODUCTS.filter(p=>p.e).length,0)}}
function totals(){const s=ROUTES.map(rStats);const sum=k=>s.reduce((a,x)=>a+x[k],0);
  return {venta:sum('venta'),meta:ROUTES.length*CFG.metaVenta,prog:sum('prog'),vis:sum('vis'),ped:sum('ped'),sv:sum('sv'),svPerd:sum('svPerd'),pendEst:sum('pendEst'),ent:sum('ent'),entTot:sum('entTot'),cobrado:sum('cobrado'),porCobrar:sum('porCobrar'),camb:sum('camb'),esen:sum('esen')}}
function alerts(){const A=[];
  ROUTES.forEach(r=>{const s=rStats(r);
    if(s.cob<0.75)A.push({lvl:'bad',t:`Ruta ${r.id}: cobertura de ${(s.cob*100).toFixed(0)}%`,d:`${r.vend} lleva ${s.vis} de ${s.prog} clientes. Venta esperada en pendientes: ${m0(s.pendEst)}.`,go:'ruta-'+r.id});
    if(s.sv>=4)A.push({lvl:'warn',t:`Ruta ${r.id}: ${s.sv} visitas sin venta`,d:`${r.vend}. Venta no capturada estimada: ${m0(s.svPerd)}.`,go:'ruta-'+r.id});
    if(r.liq.dif)A.push({lvl:'bad',t:`Ruta ${r.id}: diferencia en liquidación de ${m(r.liq.dif)}`,d:`${r.rep}. Efectivo cobrado ${m(r.liq.efectivo)}, depositado ${m(r.liq.depositado)}.`,go:'liquidaciones'});});
  const sc=CLIENTS.filter(c=>c.ult>=14);if(sc.length)A.push({lvl:'warn',t:`${sc.length} clientes sin compra en 2 semanas o más`,d:sc.slice(0,3).map(c=>c.n).join(', ')+(sc.length>3?'…':''),go:'clientes'});
  const mm=mermaBySku()[0];if(mm)A.push({lvl:'info',t:`Mayor merma: ${P(mm[0]).n}`,d:`${mm[1]} piezas en cambios recientes. Revisar surtido en las tiendas donde no rota.`,go:'merma'});
  return A}
function mermaBySku(){const M={};CLIENTS.forEach(c=>Object.entries(c.merma).forEach(([k,n])=>M[k]=(M[k]||0)+n));ORDERS.forEach(o=>o.cambios.forEach(x=>M[x.sku]=(M[x.sku]||0)+x.q));return Object.entries(M).sort((a,b)=>b[1]-a[1])}
// ================= FORMATO =================
const m=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const m0=n=>'$'+Math.round(n).toLocaleString('es-MX');
const pc=x=>(x*100).toFixed(0)+'%';
const hh=min=>`${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lvl=x=>x>=0.9?'ok':x>=0.75?'warn':'bad';
const today=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

// ================= UI =================
let UI={logged:false,err:'',drawer:null,f:{q:'',ruta:'',st:''}};
try{UI.logged=sessionStorage.getItem('hermes_sup')==='1'}catch(e){}
const IC={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 route:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/></svg>',
 team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c.8-3.5 3.6-5 7-5s6.2 1.5 7 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.3 1.2 5 4"/></svg>',

const VIEWS=[['resumen','Resumen','home'],['rutas','Rutas','route'],['equipo','Equipo','team'],['pedidos','Pedidos','list'],['clientes','Clientes','store'],['merma','Merma','box'],['liquidaciones','Liquidaciones','cash'],['config','Configuración','gear']];
let charts=[];
function chart(id,cfg){const el=document.getElementById(id);if(!el||!window.Chart)return;charts.push(new Chart(el,cfg))}
function baseOpts(extra={}){return Object.assign({responsive:true,maintainAspectRatio:false,animation:false,
  plugins:{legend:{display:false},tooltip:{backgroundColor:'#14233A',titleFont:{family:'Nunito',weight:'800'},bodyFont:{family:'Nunito'},padding:10}},
  scales:{x:{grid:{display:false},ticks:{font:{family:'Nunito',weight:'700'},color:'#66748A'}},y:{grid:{color:'#EEF2F6'},border:{display:false},ticks:{font:{family:'Nunito'},color:'#66748A'}}}},extra)}

function view(){const h=(location.hash||'#resumen').slice(1);return h||'resumen'}
window.addEventListener('hashchange',()=>{UI.drawer=null;UI.f={q:'',ruta:'',st:''};render();const c=document.getElementById('content');if(c)c.scrollTop=0});

function render(){
  charts.forEach(c=>c.destroy());charts=[];
  const app=document.getElementById('app');
  if(!UI.logged){app.innerHTML=loginView();return}
  const v=view();const navKey=v.startsWith('ruta-')?'rutas':v;
  const nAl=alerts().filter(a=>a.lvl==='bad').length;
  let title='',body='';
  if(v==='resumen'){title='Resumen del día';body=vResumen()}
  else if(v==='rutas'){title='Rutas';body=vRutas()}
  else if(v.startsWith('ruta-')){const r=RT(v.slice(5));title=r?`Ruta ${r.id} · ${r.zona}`:'Ruta';body=r?vRuta(r):'<div class="card">Ruta no encontrada.</div>'}
  else if(v==='equipo'){title='Equipo';body=vEquipo()}
  else if(v==='pedidos'){title='Pedidos';body=vPedidos()}
  else if(v==='clientes'){title='Clientes';body=vClientes()}
  else if(v==='merma'){title='Merma y cambios por caducidad';body=vMerma()}
  else if(v==='liquidaciones'){title='Liquidaciones';body=vLiq()}
  else {title='Configuración';body=vConfig()}
  app.innerHTML=`<div class="shell"><aside class="side"><div class="stripe"></div>
    <div class="brand"><div class="face"><img src="${FACE}" alt=""></div><div><div class="t">Hermes</div><div class="s">Panel del supervisor</div></div></div>
    <nav>${VIEWS.map(([k,l,i])=>`<a href="#${k}" class="${navKey===k?'on':''}">${IC[i]}${l}${k==='resumen'&&nAl?`<span class="badge">${nAl}</span>`:''}</a>`).join('')}</nav>
    <div class="foot"><b>Ana Ruiz</b>Supervisora · ${CFG.cedis}<br><button onclick="logout()">Cerrar sesión</button></div></aside>
   <div class="main"><div class="topbar"><div><h1>${esc(title)}</h1><div class="sub">${CFG.cedis} · ${today}</div></div><div class="sp"></div>
     <span class="demo">Datos simulados</span>
     <select title="CEDIS"><option>CEDIS León</option></select></div>
     <div class="content" id="content">${body}</div></div></div>
   ${UI.drawer?drawerView():''}`;
  afterRender(v);
}
function loginView(){return `<div class="login"><div class="stripe"></div><div class="box"><img src="${LOGO}" alt="Vitere"><h2>Hermes</h2><div class="muted">Panel del supervisor</div>
  <input id="u" value="Ana Ruiz" readonly><input id="pin" type="password" placeholder="PIN" maxlength="4" onkeydown="if(event.key==='Enter')login()">
  <div class="err">${UI.err}</div><button onclick="login()">Iniciar sesión</button><div class="muted" style="font-size:12px;margin-top:10px">PIN de demostración: 1234</div></div></div>`}
function login(){if(document.getElementById('pin').value!=='1234'){UI.err='PIN incorrecto';render();return}UI.logged=true;try{sessionStorage.setItem('hermes_sup','1')}catch(e){}render()}
function logout(){UI.logged=false;try{sessionStorage.removeItem('hermes_sup')}catch(e){}render()}

// ---------- RESUMEN ----------
function vResumen(){const T=totals();const cob=T.vis/T.prog;
  const A=alerts();
  return `<div class="grid k4">
   ${kpi('Venta del día',m0(T.venta),`Meta ${m0(T.meta)} · ${pc(T.venta/T.meta)}`,T.venta/T.meta)}
   ${kpi('Cobertura de clientes',pc(cob),`${T.vis} de ${T.prog} visitados`,cob)}
   ${kpi('Pedidos levantados',T.ped,`Ticket promedio ${m0(T.ped?T.venta/T.ped:0)} · ${T.sv} sin venta`)}
   ${kpi('Venta pendiente en ruta',m0(T.pendEst),`${T.prog-T.vis} clientes por visitar`)}
   ${kpi('Entregas',`${T.ent} / ${T.entTot}`,`${T.entTot-T.ent} pendientes`,T.ent/T.entTot)}
   ${kpi('Cobrado hoy',m0(T.cobrado),`Por cobrar ${m0(T.porCobrar)}`)}
   ${kpi('Venta no capturada',m0(T.svPerd),`Ticket promedio de los ${T.sv} clientes sin venta`)}
   ${kpi('Esenciales colocados',pc(T.ped?T.esen/T.ped:0),'Promedio de esenciales por pedido',T.ped?T.esen/T.ped:0)}
  </div>
  <div class="grid c2 mt">
   <div class="card"><h3>Venta del día por ruta</h3><div class="h3s">Barra: venta levantada · línea punteada: meta diaria de ${m0(CFG.metaVenta)}</div><div class="chartbox"><canvas id="chVenta"></canvas></div></div>
   <div class="card"><h3>Alertas</h3><div class="h3s">Haz clic para ver el detalle</div>${A.map(a=>`<a class="alert" href="#${a.go}" style="text-decoration:none;color:inherit"><div class="ic ${a.lvl}">${a.lvl==='info'?'i':'!'}</div><div><div class="tt">${esc(a.t)}</div><div class="dd">${esc(a.d)}</div></div></a>`).join('')||'<div class="muted">Sin alertas.</div>'}</div>
  </div>
  <div class="grid c11 mt">
   <div class="card"><h3>Venta de los últimos 7 días</h3><div class="h3s">Total del CEDIS vs. meta diaria (${m0(ROUTES.length*CFG.metaVenta)})</div><div class="chartbox"><canvas id="chHist"></canvas></div></div>
   <div class="card"><h3>Motivos de visitas sin venta</h3><div class="h3s">Hoy, todas las rutas</div><div class="chartbox"><canvas id="chSV"></canvas></div></div>
  </div>
  <div class="card mt"><h3>Avance por ruta</h3><div class="h3s">Clic en una ruta para ver el detalle</div>${tablaRutas()}</div>`}
function kpi(l,v,s,p){return `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div>${p!=null?`<div class="bar ${lvl(p)}"><div style="width:${Math.min(100,p*100)}%"></div></div>`:''}</div>`}
function tablaRutas(){return `<table class="t"><tr><th>Ruta</th><th>Zona</th><th>Preventa</th><th class="r">Cobertura</th><th class="r">Pedidos</th><th class="r">Sin venta</th><th class="r">Venta</th><th class="r">% meta</th><th>Reparto</th><th class="r">Entregas</th><th class="r">Cobrado</th><th>Liquidación</th></tr>
  ${ROUTES.map(r=>{const s=rStats(r);return `<tr class="tap" onclick="location.hash='ruta-${r.id}'"><td><b>${r.id}</b></td><td>${r.zona}</td><td>${r.vend}</td>
   <td class="r"><span class="chip ${lvl(s.cob)}">${pc(s.cob)}</span></td><td class="r">${s.ped}</td><td class="r">${s.sv}</td><td class="r"><b>${m0(s.venta)}</b></td>
   <td class="r"><span class="chip ${lvl(s.pct)}">${pc(s.pct)}</span></td><td>${r.rep}</td><td class="r">${s.ent}/${s.entTot}</td><td class="r">${m0(s.cobrado)}</td><td>${liqChip(r.liq)}</td></tr>`}).join('')}</table>`}
function liqChip(l){return l.estado==='Cerrada'?(l.dif?`<span class="chip bad">Cerrada · ${m(l.dif)}</span>`:'<span class="chip ok">Cerrada · cuadra</span>'):l.estado==='Por cerrar'?'<span class="chip warn">Por cerrar</span>':'<span class="chip info">En ruta</span>'}

// ---------- RUTAS ----------
function vRutas(){return `<div class="card"><h3>Todas las rutas</h3><div class="h3s">Preventa del día y reparto de los pedidos de ayer</div>${tablaRutas()}</div>
  <div class="card mt"><h3>Cobertura por ruta</h3><div class="h3s">% de clientes programados que ya fueron visitados</div><div class="chartbox"><canvas id="chCob"></canvas></div></div>`}
function vRuta(r){const s=rStats(r);const del=DELIV.filter(o=>o.ruta===r.id);
  const rows=r.clientes.map(c=>{const st=c.hoy.st;const o=c.hoy.oid?ORDERS.find(x=>x.id===c.hoy.oid):null;
    const chip=st==='pedido'?'<span class="chip ok">Con pedido</span>':st==='sin_venta'?'<span class="chip warn">Sin venta</span>':'<span class="chip">Pendiente</span>';
    return `<tr class="tap" onclick="openClient('${c.id}')"><td><span class="seq ${st==='pedido'?'ok':st==='sin_venta'?'warn':''}">${c.seq}</span></td><td><b>${esc(c.n)}</b></td><td>${chip}</td><td>${c.hoy.hora?hh(c.hoy.hora):'–'}</td>
     <td class="r">${o?m(o.total):'–'}</td><td class="r">${m0(c.avg)}</td><td>${st==='sin_venta'?esc(c.hoy.mot):''}</td><td class="r">${o&&o.cambios.length?o.cambios.reduce((a,x)=>a+x.q,0)+' pzas':'–'}</td></tr>`}).join('');
  return `<a class="back" href="#rutas">‹ Todas las rutas</a>
  <div class="grid k5">${kpi('Venta',m0(s.venta),`Meta ${m0(r.meta)}`,s.pct)}${kpi('Cobertura',pc(s.cob),`${s.vis} de ${s.prog} clientes`,s.cob)}${kpi('Pedidos',s.ped,`Ticket prom. ${m0(s.ticket)}`)}${kpi('Sin venta',s.sv,`No capturado ${m0(s.svPerd)}`)}${kpi('Entregas',`${s.ent}/${s.entTot}`,`Cobrado ${m0(s.cobrado)}`,s.entTot?s.ent/s.entTot:0)}</div>
  <div class="grid c32 mt">
   <div class="card"><h3>Preventa · ${r.vend}</h3><div class="h3s">Secuencia de visita definida por el sistema</div><div class="scroll"><table class="t"><tr><th>#</th><th>Cliente</th><th>Estado</th><th>Hora</th><th class="r">Pedido</th><th class="r">Ticket prom.</th><th>Motivo</th><th class="r">Cambios</th></tr>${rows}</table></div></div>
   <div class="card"><h3>Reparto · ${r.rep}</h3><div class="h3s">Pedidos levantados ayer · liquidación: ${liqChip(r.liq)}</div><div class="scroll"><table class="t"><tr><th>Pedido</th><th>Cliente</th><th>Estado</th><th class="r">Monto</th><th>Cobro</th></tr>
    ${del.map(o=>`<tr class="tap" onclick="openOrder('${o.id}')"><td>${o.id}</td><td>${esc(CL(o.cid).n)}</td><td>${o.status==='Entregado'?'<span class="chip ok">Entregado</span>':'<span class="chip">Por entregar</span>'}</td><td class="r">${m(o.cobro?o.cobro.monto:o.total)}</td><td>${o.cobro?o.cobro.met+' · '+hh(o.cobro.hora):'–'}</td></tr>`).join('')}</table></div></div>
  </div>`}

// ---------- EQUIPO ----------
function vEquipo(){const rows=ROUTES.map(r=>({r,s:rStats(r)})).sort((a,b)=>b.s.venta-a.s.venta);
  return `<div class="grid c11">
   <div class="card"><h3>Preventa</h3><div class="h3s">Ordenado por venta del día · comisión estimada al ${CFG.comision*100}%</div><table class="t"><tr><th>#</th><th>Vendedor</th><th>Ruta</th><th class="r">Venta</th><th class="r">% meta</th><th class="r">Cobertura</th><th class="r">Sin venta</th><th class="r">Ticket prom.</th><th class="r">Comisión</th></tr>
    ${rows.map((x,i)=>`<tr class="tap" onclick="location.hash='ruta-${x.r.id}'"><td>${i+1}</td><td><b>${x.r.vend}</b></td><td>${x.r.id}</td><td class="r">${m0(x.s.venta)}</td><td class="r"><span class="chip ${lvl(x.s.pct)}">${pc(x.s.pct)}</span></td><td class="r">${pc(x.s.cob)}</td><td class="r">${x.s.sv}</td><td class="r">${m0(x.s.ticket)}</td><td class="r">${m0(x.s.venta*CFG.comision)}</td></tr>`).join('')}</table></div>
   <div class="card"><h3>Reparto</h3><div class="h3s">Avance de entregas y cuadre de caja</div><table class="t"><tr><th>Repartidor</th><th>Ruta</th><th class="r">Entregas</th><th class="r">Cobrado</th><th class="r">Por cobrar</th><th>Liquidación</th></tr>
    ${ROUTES.map(r=>{const s=rStats(r);return `<tr class="tap" onclick="location.hash='ruta-${r.id}'"><td><b>${r.rep}</b></td><td>${r.id}</td><td class="r">${s.ent}/${s.entTot}</td><td class="r">${m0(s.cobrado)}</td><td class="r">${m0(s.porCobrar)}</td><td>${liqChip(r.liq)}</td></tr>`}).join('')}</table></div>
  </div>
  <div class="card mt"><h3>Cumplimiento de ruta · últimos 7 días</h3><div class="h3s">Cobertura diaria por vendedor (verde ≥ 90%, naranja 75–89%, rojo &lt; 75%)</div>
   <table class="t"><tr><th>Vendedor</th>${ROUTES[0].hist.map(h=>`<th class="r">Hace ${h.d} d</th>`).join('')}<th class="r">Promedio</th></tr>
   ${ROUTES.map(r=>{const av=r.hist.reduce((a,h)=>a+h.cob,0)/r.hist.length;return `<tr><td><b>${r.vend}</b> <span class="muted">· ${r.id}</span></td>${r.hist.map(h=>`<td class="r"><span class="chip ${lvl(h.cob)}">${pc(h.cob)}</span></td>`).join('')}<td class="r"><b>${pc(av)}</b></td></tr>`}).join('')}</table></div>`}

// ---------- PEDIDOS ----------
function vPedidos(){const f=UI.f;const q=f.q.toLowerCase();
  const list=ORDERS.filter(o=>(!f.ruta||o.ruta==f.ruta)&&(!f.st||o.status===f.st||(f.st==='Hoy'&&o.fecha==='Hoy'))&&(!q||CL(o.cid).n.toLowerCase().includes(q)||o.id.toLowerCase().includes(q)||o.vend.toLowerCase().includes(q)));
  const sum=list.reduce((a,o)=>a+o.total,0);
  return `${filtros(['','Hoy','Por entregar','Entregado'],['Todos','Levantados hoy','Por entregar','Entregados'])}
  <div class="card"><h3>${list.length} pedidos · ${m(sum)}</h3><div class="h3s">Clic en un pedido para ver productos, cambios y cobro</div><div class="scroll"><table class="t"><tr><th>Pedido</th><th>Levantado</th><th>Ruta</th><th>Cliente</th><th>Vendedor</th><th class="r">Productos</th><th class="r">Cambios</th><th class="r">Monto</th><th>Estado</th></tr>
  ${list.map(o=>`<tr class="tap" onclick="openOrder('${o.id}')"><td>${o.id}</td><td>${o.fecha} ${hh(o.hora)}</td><td>${o.ruta}</td><td><b>${esc(CL(o.cid).n)}</b></td><td>${o.vend}</td><td class="r">${Object.values(o.items).reduce((a,b)=>a+b,0)} pzas</td><td class="r">${o.cambios.reduce((a,x)=>a+x.q,0)||'–'}</td><td class="r"><b>${m(o.total)}</b></td><td>${o.status==='Entregado'?'<span class="chip ok">Entregado</span>':'<span class="chip">Por entregar</span>'}</td></tr>`).join('')}</table></div></div>`}
function filtros(stVals,stLabels){const f=UI.f;return `<div class="filters"><input placeholder="Buscar cliente, pedido o vendedor" value="${esc(f.q)}" oninput="UI.f.q=this.value;rerenderKeep(this)">
  <select onchange="UI.f.ruta=this.value;render()"><option value="">Todas las rutas</option>${ROUTES.map(r=>`<option value="${r.id}" ${f.ruta==r.id?'selected':''}>Ruta ${r.id}</option>`).join('')}</select>
  ${stVals?`<select onchange="UI.f.st=this.value;render()">${stVals.map((v,i)=>`<option value="${v}" ${f.st===v?'selected':''}>${stLabels[i]}</option>`).join('')}</select>`:''}</div>`}
function rerenderKeep(el){const pos=el.selectionStart;render();const i=document.querySelector('.filters input');if(i){i.focus();i.setSelectionRange(pos,pos)}}

// ---------- CLIENTES ----------
function vClientes(){const f=UI.f;const q=f.q.toLowerCase();const mn=minPedido();
  const list=CLIENTS.filter(c=>(!f.ruta||c.ruta==f.ruta)&&(!q||c.n.toLowerCase().includes(q))&&(!f.st||(f.st==='sin'&&c.ult>=14)||(f.st==='merma'&&Object.keys(c.merma).length)||(f.st==='bajo'&&c.avg<mn)));
  return `${filtros(['','sin','merma','bajo'],['Todos','Sin compra 2+ semanas','Con merma recurrente','Ticket menor al pedido mínimo'])}
  <div class="card"><h3>${list.length} clientes</h3><div class="h3s">Clic en un cliente para ver su perfil</div><div class="scroll"><table class="t"><tr><th>Cliente</th><th>Ruta</th><th class="r">Ticket prom.</th><th>Última compra</th><th>Hoy</th><th>Merma recurrente</th><th>Compra habitual</th></tr>
  ${list.map(c=>`<tr class="tap" onclick="openClient('${c.id}')"><td><b>${esc(c.n)}</b></td><td>${c.ruta}</td><td class="r">${m0(c.avg)} ${c.avg<mn?'<span class="chip warn">bajo mínimo</span>':''}</td><td>${c.ult>=14?`<span class="chip bad">Hace ${c.ult} días</span>`:`Hace ${c.ult} días`}</td>
   <td>${c.hoy.st==='pedido'?'<span class="chip ok">Con pedido</span>':c.hoy.st==='sin_venta'?'<span class="chip warn">Sin venta</span>':'<span class="chip">Pendiente</span>'}</td>
   <td>${Object.entries(c.merma).map(([k,n])=>`<span class="chip mag">${P(k).n} · ${n}</span>`).join(' ')||'–'}</td><td class="muted">${Object.keys(c.rec).length} productos</td></tr>`).join('')}</table></div></div>`}

// ---------- MERMA ----------
function vMerma(){const bs=mermaBySku();const byR=ROUTES.map(r=>({r,n:r.clientes.reduce((a,c)=>a+Object.values(c.merma).reduce((x,y)=>x+y,0),0)+ORDERS.filter(o=>o.ruta===r.id).reduce((a,o)=>a+o.cambios.reduce((b,x)=>b+x.q,0),0)}));
  const totPz=bs.reduce((a,x)=>a+x[1],0);const val=bs.reduce((a,[k,n])=>a+price(k)*n,0);
  const cl=CLIENTS.filter(c=>Object.keys(c.merma).length).sort((a,b)=>Object.values(b.merma)[0]-Object.values(a.merma)[0]);
  window._byR=byR;window._bs=bs;
  return `<div class="grid k4">${kpi('Piezas en cambio',totPz,'Historial reciente + cambios de hoy')}${kpi('Valor a precio de venta',m0(val),'Base para reclamar al proveedor')}${kpi('Clientes con merma recurrente',cl.length,`de ${CLIENTS.length} clientes`)}${kpi('Producto con más merma',bs[0]?P(bs[0][0]).n:'–',bs[0]?bs[0][1]+' piezas':'')}</div>
  <div class="grid c11 mt"><div class="card"><h3>Piezas por producto</h3><div class="h3s">Productos con más cambios por caducidad o daño</div><div class="chartbox" style="height:${Math.max(240,bs.length*26)}px"><canvas id="chMerma"></canvas></div></div>
   <div class="card"><h3>Piezas por ruta</h3><div class="h3s">Dónde se concentra la merma</div><div class="chartbox"><canvas id="chMermaR"></canvas></div></div></div>
  <div class="card mt"><h3>Clientes con merma recurrente</h3><div class="h3s">Candidatos a ajustar el pedido sugerido o sustituir el producto</div><div class="scroll"><table class="t"><tr><th>Cliente</th><th>Ruta</th><th>Producto</th><th class="r">Cambios recientes</th><th>Sugerencia</th></tr>
   ${cl.map(c=>Object.entries(c.merma).map(([k,n])=>{const sub=ZONA.map(P).find(x=>x.c===P(k).c&&x.id!=k&&!c.rec[x.id]);return `<tr class="tap" onclick="openClient('${c.id}')"><td><b>${esc(c.n)}</b></td><td>${c.ruta}</td><td>${P(k).n}</td><td class="r">${n}</td><td class="muted">Reducir a la mitad${sub?` y ofrecer ${sub.n}`:''}</td></tr>`}).join('')).join('')}</table></div></div>`}

// ---------- LIQUIDACIONES ----------
function vLiq(){const T=ROUTES.reduce((a,r)=>({e:a.e+r.liq.efectivo,t:a.t+r.liq.transf,d:a.d+(r.liq.dif||0)}),{e:0,t:0,d:0});
  return `<div class="grid k4">${kpi('Efectivo cobrado',m0(T.e),'Todas las rutas')}${kpi('Transferencias',m0(T.t),'Todas las rutas')}${kpi('Diferencias',m(T.d),'Liquidaciones cerradas')}${kpi('Liquidaciones cerradas',`${ROUTES.filter(r=>r.liq.estado==='Cerrada').length} / ${ROUTES.length}`,'')}</div>
  <div class="card mt"><h3>Liquidación por repartidor</h3><div class="h3s">Efectivo cobrado vs. depositado en caja</div><table class="t"><tr><th>Ruta</th><th>Repartidor</th><th class="r">Valor en ruta</th><th class="r">Entregas</th><th class="r">Efectivo</th><th class="r">Transferencia</th><th class="r">Depositado</th><th class="r">Diferencia</th><th>Estado</th></tr>
  ${ROUTES.map(r=>{const l=r.liq;return `<tr class="tap" onclick="location.hash='ruta-${r.id}'"><td><b>${r.id}</b></td><td>${r.rep}</td><td class="r">${m(l.esperado)}</td><td class="r">${l.entregas}/${l.total}</td><td class="r">${m(l.efectivo)}</td><td class="r">${m(l.transf)}</td><td class="r">${l.depositado!=null?m(l.depositado):'–'}</td><td class="r">${l.dif?`<b style="color:var(--bad)">${m(l.dif)}</b>`:(l.dif===0?'$0.00':'–')}</td><td>${liqChip(l)}</td></tr>`}).join('')}</table></div>`}

// ---------- CONFIGURACIÓN ----------
function vConfig(){const mn=minPedido();const bajo=CLIENTS.filter(c=>c.avg<mn).length;
  return `<div class="grid c11"><div class="card form"><h3>Pedido mínimo (breakeven por visita)</h3><div class="h3s">Pedido mínimo = costo por visita ÷ margen bruto</div>
   <label>Costo por visita (MXN)</label><input type="number" value="${CFG.costoVisita}" onchange="CFG.costoVisita=+this.value||0;render()">
   <label>Margen bruto (%)</label><input type="number" value="${(CFG.margen*100).toFixed(1)}" step="0.5" onchange="CFG.margen=(+this.value||1)/100;render()">
   <div class="mt">Pedido mínimo resultante</div><div class="big">${m0(mn)}</div>
   <div class="note mt">${bajo} de ${CLIENTS.length} clientes tienen un ticket promedio menor a este mínimo. Revísalos en Clientes → "Ticket menor al pedido mínimo".</div></div>
  <div class="card form"><h3>Metas y comisiones</h3><div class="h3s">Aplican a todas las rutas del CEDIS</div>
   <label>Meta de venta diaria por ruta (MXN)</label><input type="number" value="${CFG.metaVenta}" onchange="CFG.metaVenta=+this.value||1;ROUTES.forEach(r=>r.meta=CFG.metaVenta);render()">
   <label>Comisión del preventa (%)</label><input type="number" value="${CFG.comision*100}" step="0.5" onchange="CFG.comision=(+this.value||0)/100;render()">
   <div class="note mt">En la demo los cambios se aplican solo en esta sesión. Con la base de datos conectada se guardarán y llegarán a las apps de ruta.</div></div></div>
  <div class="card mt"><h3>Listas de precios por región</h3><div class="h3s">Precio por pieza en MXN · los productos esenciales van marcados</div><table class="t"><tr><th>Producto</th><th>Categoría</th><th>Esencial</th><th class="r">Ranking en zona</th><th class="r">Centro</th><th class="r">Pacífico</th></tr>
   ${PRODUCTS.map(p=>`<tr><td><b>${p.n}</b></td><td>${p.c}</td><td>${p.e?'<span class="chip info">Esencial</span>':''}</td><td class="r">#${ZONA.indexOf(p.id)+1}</td><td class="r">${m(p.p.Centro)}</td><td class="r">${m(p.p['Pacífico'])}</td></tr>`).join('')}</table></div>`}

// ---------- DRAWER ----------
function openOrder(id){UI.drawer={t:'o',id};render()}
function openClient(id){UI.drawer={t:'c',id};render()}
function drawerView(){const d=UI.drawer;let h='';
  if(d.t==='o'){const o=ORDERS.find(x=>x.id===d.id),c=CL(o.cid);
    h=`<h2 style="margin:0;color:var(--pri)">Pedido ${o.id}</h2><div class="muted">${esc(c.n)} · Ruta ${o.ruta}</div>
     <div class="kv"><div>Levantado</div><div>${o.fecha} ${hh(o.hora)}</div><div>Vendedor</div><div>${o.vend}</div><div>Estado</div><div>${o.status}</div>${o.cobro?`<div>Cobro</div><div>${o.cobro.met} · ${hh(o.cobro.hora)}</div>`:''}</div>
     <table class="t"><tr><th>Producto</th><th class="r">Pedido</th>${o.entregado?'<th class="r">Entregado</th>':''}<th class="r">Importe</th></tr>
     ${Object.entries(o.items).map(([k,q])=>`<tr><td>${P(k).n}</td><td class="r">${q}</td>${o.entregado?`<td class="r">${o.entregado[k]||0}${(o.entregado[k]||0)<q?' <span class="chip warn">ajuste</span>':''}</td>`:''}<td class="r">${m(price(k)*(o.entregado?(o.entregado[k]||0):q))}</td></tr>`).join('')}</table>
     <div class="total"><span>${o.cobro?'Cobrado':'Total'}</span><span>${m(o.cobro?o.cobro.monto:o.total)}</span></div>
     <h3 class="mt">Cambios por caducidad</h3>${o.cambios.length?o.cambios.map(x=>`<div style="margin:6px 0">${x.q} × ${P(x.sku).n} <span class="chip warn">${x.m}</span> ${x.hecho===undefined?'':x.hecho?'<span class="chip ok">Hecho</span>':'<span class="chip bad">No hecho</span>'}</div>`).join(''):'<div class="muted">Sin cambios.</div>'}`}
  else{const c=CL(d.id);const os=ORDERS.filter(o=>o.cid===c.id);
    h=`<h2 style="margin:0;color:var(--pri)">${esc(c.n)}</h2><div class="muted">${c.dir}</div>
     <div class="kv"><div>Ruta</div><div>${c.ruta} · posición ${c.seq}</div><div>Teléfono</div><div>${c.tel}</div><div>Ticket promedio</div><div>${m(c.avg)}</div><div>Última compra</div><div>Hace ${c.ult} días</div>
     <div>Hoy</div><div>${c.hoy.st==='pedido'?'Con pedido':c.hoy.st==='sin_venta'?'Sin venta · '+esc(c.hoy.mot):'Pendiente'}</div></div>
     <h3>Compra habitual</h3><table class="t">${Object.entries(c.rec).map(([k,q])=>`<tr><td>${P(k).n}</td><td class="r">${q} pzas</td></tr>`).join('')}</table>
     <h3 class="mt">Merma recurrente</h3>${Object.entries(c.merma).map(([k,n])=>`<div style="margin:6px 0">${P(k).n} <span class="chip mag">${n} cambios</span></div>`).join('')||'<div class="muted">Sin merma recurrente.</div>'}
     <h3 class="mt">Pedidos recientes</h3>${os.map(o=>`<div style="display:flex;justify-content:space-between;margin:6px 0;cursor:pointer" onclick="openOrder('${o.id}')"><span>${o.id} · ${o.fecha}</span><b>${m(o.total)}</b></div>`).join('')||'<div class="muted">Sin pedidos recientes.</div>'}`}
  return `<div class="drawer" onclick="if(event.target===this){UI.drawer=null;render()}"><div class="pane"><button class="x" onclick="UI.drawer=null;render()">Cerrar</button>${h}</div></div>`}

// ---------- GRÁFICAS ----------
function afterRender(v){
  if(v==='resumen'){
    const s=ROUTES.map(rStats);
    chart('chVenta',{type:'bar',data:{labels:ROUTES.map(r=>'Ruta '+r.id),datasets:[
      {type:'line',label:'Meta',data:ROUTES.map(r=>r.meta),borderColor:'#66748A',borderDash:[6,5],borderWidth:2,pointRadius:0},
      {label:'Venta',data:s.map(x=>x.venta),backgroundColor:s.map(x=>x.pct>=0.9?'#1C5DAE':x.pct>=0.75?'#5B8FD0':'#A9C3E6'),borderRadius:4,maxBarThickness:42}]},
      options:baseOpts({plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${m0(c.raw)}`}}},scales:{x:{grid:{display:false}},y:{grid:{color:'#EEF2F6'},border:{display:false},ticks:{callback:v=>m0(v)}}}})});
    const days=ROUTES[0].hist.map(h=>`Hace ${h.d} d`);const tot=ROUTES[0].hist.map((_,i)=>ROUTES.reduce((a,r)=>a+r.hist[i].venta,0));
    chart('chHist',{type:'line',data:{labels:[...days,'Hoy (parcial)'],datasets:[
      {label:'Venta',data:[...tot,totals().venta],borderColor:'#043D80',backgroundColor:'#043D80',borderWidth:2,pointRadius:4,tension:.25},
      {label:'Meta',data:Array(8).fill(ROUTES.length*CFG.metaVenta),borderColor:'#66748A',borderDash:[6,5],borderWidth:2,pointRadius:0}]},
      options:baseOpts({interaction:{mode:'index',intersect:false},plugins:{legend:{display:true,position:'bottom',labels:{font:{family:'Nunito',weight:'700'},boxWidth:14}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${m0(c.raw)}`}}},scales:{x:{grid:{display:false}},y:{grid:{color:'#EEF2F6'},border:{display:false},ticks:{callback:v=>m0(v)}}}})});
    const sv={};CLIENTS.filter(c=>c.hoy.st==='sin_venta').forEach(c=>sv[c.hoy.mot]=(sv[c.hoy.mot]||0)+1);const svE=Object.entries(sv).sort((a,b)=>b[1]-a[1]);
    chart('chSV',{type:'bar',data:{labels:svE.map(x=>x[0]),datasets:[{label:'Visitas',data:svE.map(x=>x[1]),backgroundColor:'#FCA728',borderRadius:4,maxBarThickness:30}]},options:baseOpts({indexAxis:'y',scales:{x:{grid:{color:'#EEF2F6'},border:{display:false},ticks:{precision:0}},y:{grid:{display:false}}}})});
  }
  if(v==='rutas'){const s=ROUTES.map(rStats);
    chart('chCob',{type:'bar',data:{labels:ROUTES.map(r=>`Ruta ${r.id} · ${r.vend}`),datasets:[{label:'Cobertura',data:s.map(x=>Math.round(x.cob*100)),backgroundColor:s.map(x=>x.cob>=0.9?'#3E8E06':x.cob>=0.75?'#FCA728':'#C0392B'),borderRadius:4,maxBarThickness:26}]},
      options:baseOpts({indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`Cobertura: ${c.raw}%`}}},scales:{x:{min:0,max:100,grid:{color:'#EEF2F6'},border:{display:false},ticks:{callback:v=>v+'%'}},y:{grid:{display:false}}}})});}
  if(v==='merma'){const bs=window._bs,byR=window._byR;
    chart('chMerma',{type:'bar',data:{labels:bs.map(([k])=>P(k).n),datasets:[{label:'Piezas',data:bs.map(x=>x[1]),backgroundColor:'#E60182',borderRadius:4,maxBarThickness:20}]},options:baseOpts({indexAxis:'y',scales:{x:{grid:{color:'#EEF2F6'},border:{display:false},ticks:{precision:0}},y:{grid:{display:false}}}})});
    chart('chMermaR',{type:'bar',data:{labels:byR.map(x=>'Ruta '+x.r.id),datasets:[{label:'Piezas',data:byR.map(x=>x.n),backgroundColor:'#043D80',borderRadius:4,maxBarThickness:40}]},options:baseOpts({scales:{x:{grid:{display:false}},y:{grid:{color:'#EEF2F6'},border:{display:false},ticks:{precision:0}}}})});}
}
